<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Left Foot Software · Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* LFS growth dashboard V2 (slides). Brand tokens copied from ../style.css (BRAND.md, frozen 2026-08-01):
   one accent #267884, Plus Jakarta Sans + Inter. One idea per slide: eyebrow, headline, one visual. */
:root {
  --brand: #267884; --brand-light: #77BEC8;
  --n-text: #0F172A; --n-body: #475569; --n-muted: #94A3B8; --n-ink: #0B1120; --n-surface: #FFFFFF; --n-alt: #F8FAFC;
  --text: var(--n-text); --body: var(--n-body); --muted: color-mix(in srgb, var(--n-body) 85%, var(--n-surface));
  --surface: var(--n-surface); --bg: var(--n-alt); --line: color-mix(in srgb, var(--n-muted) 35%, var(--n-surface));
  --grid: color-mix(in srgb, var(--n-muted) 20%, var(--n-surface)); --accent: var(--brand); --on-accent: var(--n-surface);
  --fill: color-mix(in srgb, var(--brand) 12%, var(--n-surface)); --band: color-mix(in srgb, var(--brand) 9%, transparent);
  --area: color-mix(in srgb, var(--brand) 14%, transparent);
  --series2: color-mix(in srgb, var(--n-body) 55%, var(--n-surface)); --series3: color-mix(in srgb, var(--n-muted) 45%, var(--n-surface));
  --warm: #D9762B; --warm-dim: color-mix(in srgb, #D9762B 32%, var(--n-surface));
  --font-head: "Plus Jakarta Sans", system-ui, sans-serif; --font-body: "Inter", system-ui, sans-serif;
}
[data-theme="dark"] {
  --warm: #F0A04B; --warm-dim: color-mix(in srgb, #F0A04B 30%, var(--n-text));
  --text: var(--n-alt); --body: color-mix(in srgb, var(--n-muted) 65%, var(--n-surface)); --muted: var(--n-muted);
  --surface: var(--n-text); --bg: var(--n-ink); --line: color-mix(in srgb, var(--n-body) 55%, var(--n-text));
  --grid: color-mix(in srgb, var(--n-body) 35%, var(--n-text)); --accent: var(--brand-light); --on-accent: var(--n-ink);
  --fill: color-mix(in srgb, var(--brand) 26%, var(--n-text)); --band: color-mix(in srgb, var(--brand-light) 10%, transparent);
  --area: color-mix(in srgb, var(--brand-light) 16%, transparent);
  --series2: color-mix(in srgb, var(--n-muted) 75%, var(--n-text)); --series3: color-mix(in srgb, var(--n-body) 75%, var(--n-text));
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-head); color: var(--text); margin: 0; }
a { color: var(--accent); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.hdr { display: flex; align-items: center; gap: 12px; padding: 14px 24px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 16px var(--font-head); color: var(--text); margin-right: auto; }
.brand .dot { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--body); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tools { display: flex; gap: 8px; align-items: center; }
.rangesel select { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 30px 6px 12px;
  font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--text);
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.icon { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; height: 33px; min-width: 33px; padding: 0 9px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--text); text-decoration: none; }

/* slide */
#deck { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
.slide { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 34px 40px 30px; min-height: calc(100vh - 150px);
  display: flex; flex-direction: column; gap: 22px; }
.slide[hidden] { display: none; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .02em; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.eyebrow .per { color: var(--muted); font-weight: 600; }
.headline { font-size: 30px; line-height: 1.2; font-weight: 800; max-width: 860px; letter-spacing: -0.01em; }
.headline:focus { outline: none; }
.body { flex: 1; display: flex; flex-direction: column; gap: 22px; }
.note { font-size: 13px; color: var(--muted); }

/* numbers */
.nums { display: grid; grid-template-columns: 1.5fr repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.num { padding: 16px 18px 16px 0; min-width: 0; }
.num + .num { padding-left: 18px; border-left: 1px solid var(--line); }
.num .l { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.num .v { font: 800 30px/1.15 var(--font-head); color: var(--text); margin: 4px 0 6px; white-space: nowrap; }
.num.big .v { font-size: 46px; }
.info { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 13px; line-height: 1; }
.info:hover { color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: var(--accent); color: var(--on-accent); }
.chip.bad { border: 1.5px solid var(--text); color: var(--text); padding: 1px 8px; }
.chip.flat, .chip.na { background: var(--bg); color: var(--muted); border: 1px solid var(--line); padding: 1px 8px; }
.chip .sub { font-weight: 600; opacity: .85; }
.mini.three { grid-template-columns: repeat(3, 1fr); }
.mini.bridge { grid-template-columns: repeat(var(--c, 5), 1fr); }
.mini.three .num:nth-child(3n+1) { border-left: 0; padding-left: 0; }
.mini.three .num:nth-child(n+4) { border-top: 1px solid var(--line); }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line); }
.mini .num .v { font-size: 24px; }

/* charts */
.ch { width: 100%; position: relative; }
.chart { display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 12px var(--font-body); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--body); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.tip { position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--surface); font-size: 12.5px; padding: 7px 10px;
  border-radius: 8px; display: none; max-width: 260px; line-height: 1.45; }
.pop { position: absolute; z-index: 60; max-width: 300px; background: var(--text); color: var(--surface); font-size: 13px; line-height: 1.45;
  padding: 10px 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }

/* ranked rows */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 110px; gap: 12px; align-items: center; padding: 9px 12px;
  border-radius: 10px; font-size: 15px; }
.row.no-spark { grid-template-columns: minmax(0, 1fr) 70px 84px; }
.row > .f { position: absolute; inset: 0 auto 0 0; background: var(--fill); border-radius: 10px; }
.row > * { position: relative; }
.row .nm { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 700; }
.row .s { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.rows-h { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 110px; gap: 12px; padding: 0 12px; font-size: 12px; color: var(--muted); font-weight: 600; }
.rows-h.no-spark { grid-template-columns: minmax(0, 1fr) 70px 84px; }
.rows-h span:not(:first-child) { text-align: right; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.cols h3 { font-size: 15px; margin-bottom: 10px; }

/* funnels */
.fun { display: flex; flex-direction: column; gap: 10px; }
.fun .st { display: grid; grid-template-columns: 170px 1fr 120px; gap: 14px; align-items: center; }
.fun .st .l { font-size: 14px; color: var(--text); font-weight: 600; }
.fun .bar { height: 30px; background: var(--fill); border-radius: 8px; position: relative; overflow: hidden; }
.fun .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 8px; }
.fun .st .v { text-align: right; font: 800 20px var(--font-head); color: var(--text); }
.fun .st .v small { display: block; font: 600 12px var(--font-body); color: var(--muted); }
.fun h3 { font-size: 15px; }

/* insights */
.ins { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ins li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; }
.ins li:first-child { border-top: 0; }
.ins .mk { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin-top: 2px; }
.ins .mk.good { background: var(--accent); color: var(--on-accent); }
.ins .mk.bad { border: 1.5px solid var(--text); color: var(--text); }
.ins .mk.info { background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.ins .t { font: 700 16px var(--font-head); color: var(--text); }
.ins .t .app { font: 600 12px var(--font-body); color: var(--muted); margin-left: 6px; }
.ins .w { grid-column: 2; font-size: 13.5px; color: var(--body); }
.ins .nx { grid-column: 2; font-size: 13.5px; color: var(--text); }
.ins .nx::before { content: "Next: "; font-weight: 700; color: var(--accent); }
.ins.compact li { padding: 10px 0; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; font-size: 14px; }

/* details */
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 14px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; } details.more[open] > summary::before { content: "− "; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 16px; }
th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 5px 6px; border-bottom: 1px solid var(--line); }
td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
h3.dt { font-size: 13.5px; margin: 12px 0 2px; }
.na { color: var(--muted); }
.warn { font-size: 13px; border-left: 3px solid var(--accent); background: var(--bg); padding: 8px 12px; border-radius: 8px; }

/* pager */
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 24px 28px; }
.pager .arrow { border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 17px; color: var(--text); }
.pager .arrow:disabled { opacity: .35; cursor: default; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots button { border: 0; padding: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--line); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--accent); width: 24px; border-radius: 6px; }
.pager .cnt { font-size: 13px; color: var(--muted); min-width: 120px; text-align: center; }

@media (max-width: 760px) {
  .hdr { padding: 10px 12px; gap: 8px; }
  .hdr .seg { order: 3; width: 100%; } .hdr .seg button { flex: 1; padding: 6px 4px; font-size: 13px; }
  #deck { padding: 0 10px; }
  .slide { padding: 22px 18px; border-radius: 14px; min-height: 0; gap: 18px; }
  .headline { font-size: 23px; }
  .nums, .mini { grid-template-columns: 1fr 1fr; }
  .num { padding: 12px 10px 12px 0; } .num + .num { padding-left: 12px; }
  .nums .num.big { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-bottom: 1px solid var(--line); }
  .nums .num:nth-child(2), .nums .num:nth-child(4), .mini .num:nth-child(3) { border-left: 0; padding-left: 0; }
  .mini.three { grid-template-columns: 1fr 1fr; }
  .mini.bridge { grid-template-columns: 1fr 1fr; }
  .mini.bridge .num:nth-child(odd) { border-left: 0; padding-left: 0; } .mini.bridge .num:nth-child(even) { border-left: 1px solid var(--line); padding-left: 12px; }
  .mini.bridge .num:nth-child(n+3) { border-top: 1px solid var(--line); }
  .mini.three .num:nth-child(odd) { border-left: 0; padding-left: 0; } .mini.three .num:nth-child(even) { border-left: 1px solid var(--line); padding-left: 12px; }
  .mini.three .num:nth-child(n+3) { border-top: 1px solid var(--line); }
  .num .v { font-size: 24px; } .num.big .v { font-size: 38px; }
  .cols { grid-template-columns: 1fr; gap: 24px; }
  .row, .rows-h { grid-template-columns: minmax(0, 1fr) 54px 54px 70px; gap: 8px; font-size: 14px; }
  .row.no-spark, .rows-h.no-spark { grid-template-columns: minmax(0, 1fr) 54px 54px; }
  .fun .st { grid-template-columns: 1fr 90px; } .fun .st .bar { grid-column: 1 / -1; grid-row: 2; }
  .pager .cnt { min-width: 0; font-size: 12px; }
}
@media print {
  .hdr .seg, .tools, .pager { display: none; }
  html, body { background: #fff; }
  .slide[hidden] { display: flex; }
  .slide { break-after: page; min-height: 0; border: 0; padding: 10px 0; }
  details.more { display: none; }
}

/* one data point per slide */
.hl { font-style: normal; font-weight: 800; }
.hl.good { color: var(--accent); } .hl.bad { color: var(--warm); } .hl.flat { color: var(--accent); }
.headline { font-size: 32px; max-width: 900px; }
.row.two { grid-template-columns: minmax(0, 1fr) 90px; }
.lead { font-size: 20px; line-height: 1.5; color: var(--text); margin: 6px 0 0; max-width: 760px; }
.nextline { font-size: 17px; color: var(--text); margin: 14px 0 6px; max-width: 760px; }
.nextline b { color: var(--accent); }
.pager { gap: 12px; }
.pg { display: flex; flex-direction: column; gap: 8px; min-width: 260px; flex: 0 1 460px; }
.prog { height: 5px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.jump select { width: 100%; appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-size: 13.5px; color: var(--text); cursor: pointer; }
.chip.bad, .ins .mk.bad { background: var(--warm); border-color: var(--warm); color: var(--n-text); }
@media (max-width: 760px) { .headline { font-size: 24px; } .lead { font-size: 17px; } .pg { min-width: 0; flex: 1 1 auto; } }

/* v3: scoreboard tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 12px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.tl { font-size: 12px; color: var(--muted); }
.tv { font-family: var(--font-head); font-size: 24px; font-weight: 800; color: var(--text); margin: 2px 0; }
.tc { font-size: 12px; } .tx { color: var(--muted); }
.slide table td small, .rows small { color: var(--muted); font-weight: 500; }
@media (max-width: 560px) { .slide table { font-size: 11.5px; } .slide table th, .slide table td { padding: 4px 3px; } }

/* v3b: trends + funnel */
.spark { display: block; margin: 4px 0 2px; overflow: visible; }
td .spark { margin: 0 auto; }
.vd { font-size: 11px; font-weight: 700; } .vd.good { color: var(--accent); } .vd.bad { color: var(--warm); } .vd.flat { color: var(--muted); }
.tblwrap table td, .tblwrap table th { padding: 4px 5px; white-space: nowrap; }
.tblwrap table td:first-child { white-space: normal; min-width: 120px; }
.acts { margin: 4px 0 10px 18px; padding: 0; font-size: 14px; } .acts li { margin: 4px 0; }
.funnel { display: block; max-width: 740px; }
.funnel .fnum { font: 800 15px var(--font-head); fill: #fff; }
.funnel .flab { font: 500 11px var(--font-body); fill: #fff; }
.funnel .fsys { font: 600 11px var(--font-body); fill: var(--muted); }
.funnel .frate { font: 800 16px var(--font-head); fill: var(--text); }
.funnel .fsub { font: 500 11px var(--font-body); fill: var(--muted); }
.funnel .vd-good { fill: var(--accent); font-weight: 700; } .funnel .vd-bad { fill: var(--warm); font-weight: 700; } .funnel .vd-flat { fill: var(--muted); }

</style>
</head>
<body>
<header class="hdr">
  <div class="brand"><div class="dot" aria-hidden="true"></div><span>Growth</span></div>
  <nav class="seg" id="pageSeg" aria-label="Dashboard">
    <button data-p="all" data-k="p-all">Combined</button><button data-p="gs1" data-k="p-gs1">GS1 Assistant</button><button data-p="lw" data-k="p-lw">Label Wizard</button>
  </nav>
  <nav class="seg" id="layerSeg" aria-label="Level of detail"><button data-l="exec" data-k="l-exec">Summary</button><button data-l="detail" data-k="l-detail">Detail</button></nav>
  <div class="tools">
    <label class="rangesel"><span class="sr">Period</span><select id="rangeSel" data-k="range">
      <option value="mtd">Month to date</option><option value="30d">Last 30 days</option><option value="90d">Last 90 days</option><option value="all">Since 1 Jul 2026 (H2)</option>
    </select></label>
    <button class="icon" id="themeBtn" aria-label="Switch to dark theme">◐</button>
    <a class="icon v1only" id="v1Link" href="../" title="Open the detailed V1 dashboard">V1</a>
  </div>
</header>
<main id="deck" aria-live="off"></main>
<nav class="pager" id="pager" aria-label="Slides"></nav>

    const per = (key, lo, hi_) => { const a = agg(series(ap, key), lo, hi_); return a.none ? null : a.v / (hi_ - lo + 1); };

    const ra = (() => { const v = agg(series(ap, "visits"), i0 + 1, i0 + n).v, a = agg(series(ap, "add_app"), i0 + 1, i0 + n).v; return v >= 30 ? a / v : null; })();

    return [`<span style="white-space:nowrap">${esc(c.date)}</span>`, esc(NAME[ap]), `${n} days`, d(vb, va), d(rb, ra, true), d(ib, ia)];
  }).filter(Boolean);
  return { eyebrow: "Before / after listing changes", fixed: true, h: "Did each listing change move visits, Add app clicks or installs?",
    body: table(["Change date", "App", "Days compared", "Visits a day", "Clicked Add app", "Installs a day"], rows)
      + NOTE("Same number of days before and after each change, up to 28. A change needs 14+ days of data. Other things change at the same time (season, ads, Black Friday, other edits), so treat this as a lead to check, not proof. Details of each change: Listing changes.") };
}

/* ---------- shell ---------- */
let SLIDES = [];
function render(opt = {}) {
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  CH.length = 0; for (const k in HOV) delete HOV[k];
  document.querySelectorAll("#pageSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === S.page)));
  document.querySelectorAll("#layerSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === S.layer)));

  if (S.range === "mtd") { const pm = new Date(DATES[DATES.length - 1].slice(0, 7) + "-01T00:00:00Z"); pm.setUTCMonth(pm.getUTCMonth() - 1); RANGE_NAME.mtd[1] = "the same days of " + monthName(pm.toISOString().slice(0, 7), true).split(" ")[0]; }
  SLIDES = deck(S.page);
  const cur = Math.min(S.slide[S.page], SLIDES.length - 1); S.slide[S.page] = cur;
  const r = range(), yr = { day: "numeric", month: "short", year: "numeric" }, per = S.range === "all" ? `Since 1 Jul 2026 to ${day(DATES[r.hi], yr)}` : `${day(DATES[r.lo], DATES[r.lo].slice(0, 4) === DATES[r.hi].slice(0, 4) ? undefined : yr)} – ${day(DATES[r.hi], yr)}`;
  const warns = (window.SNAPSHOT_PARTIAL ? [window.SNAPSHOT_PARTIAL] : []).concat(D.warnings || []);
  $("#deck").innerHTML = SLIDES.map((s, i) => `<section class="slide" id="slide-${i}" aria-roledescription="slide" aria-label="${esc(s.eyebrow)}, ${i + 1} of ${SLIDES.length}" ${opt.print || i === cur ? "" : "hidden"}>
    <div class="eyebrow"><span>${esc(S.page === "all" ? "Combined" : NAME[S.page])} · ${esc(s.eyebrow)}</span>${s.fixed ? "" : `<span class="per">${esc(per)}</span>`}</div>
    ${i === 0 ? warns.map((w) => `<div class="warn">${esc(w)}</div>`).join("") : ""}
    <h2 class="headline" tabindex="-1">${s.h}</h2><div class="body">${s.body}</div></section>`).join("");
  $("#pager").innerHTML = SLIDES.length > 1 ? `<button class="arrow" data-nav="-1" data-k="prev" aria-label="Previous slide" ${cur === 0 ? "disabled" : ""}>←</button>
    <div class="pg"><div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${SLIDES.length}" aria-valuenow="${cur + 1}" aria-label="Slide ${cur + 1} of ${SLIDES.length}"><i style="width:${((cur + 1) / SLIDES.length) * 100}%"></i></div>
      <label class="jump"><span class="sr">Go to slide</span><select id="jump" data-k="jump">${SLIDES.map((s, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${i + 1} of ${SLIDES.length} · ${esc(s.eyebrow)}</option>`).join("")}</select></label></div>
    <button class="arrow" data-nav="1" data-k="next" aria-label="Next slide" ${cur === SLIDES.length - 1 ? "disabled" : ""}>→</button>` : "";

  paint();
  const h = `#${S.page}/${cur + 1}?range=${S.range}${S.layer === "detail" ? "&layer=detail" : ""}`; if (location.hash !== h) history.replaceState(null, "", h);
  if (opt.focusHead) { const hd = $(`#slide-${cur} .headline`); if (hd) hd.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else if (keep) { const el = document.querySelector(`[data-k="${CSS.escape(keep)}"]`); if (el) el.focus({ preventScroll: true }); }

}
function go(n) { const t = Math.max(0, Math.min(SLIDES.length - 1, n)); if (t !== S.slide[S.page]) { S.slide[S.page] = t; render({ focusHead: true }); } }
function readHash() {
  const [path, q] = location.hash.slice(1).split("?"), [p, n] = (path || "").split("/");
  if (["all", "gs1", "lw"].includes(p)) { S.page = p; if (+n >= 1) S.slide[p] = +n - 1; }
  if (new URLSearchParams(q || "").get("layer") === "detail") S.layer = "detail";
  const r = new URLSearchParams(q || "").get("range"); if (["mtd", "30d", "90d", "all"].includes(r)) S.range = r;

function hidePop() { $("#pop").hidden = true; document.querySelectorAll(".info[aria-expanded='true']").forEach((b) => b.setAttribute("aria-expanded", "false")); }
function onClick(e) {

    const p = $("#pop"), open = t.getAttribute("aria-expanded") === "true"; hidePop(); if (open) return;
    p.textContent = DEF()[t.dataset.info] || V.definitions[t.dataset.info] || ""; p.hidden = false; t.setAttribute("aria-expanded", "true");
    const b = t.getBoundingClientRect(); p.style.left = Math.max(8, Math.min(b.left + scrollX - 10, scrollX + innerWidth - 316)) + "px"; p.style.top = b.bottom + scrollY + 8 + "px"; return;
  }
  if (t.tagName === "SUMMARY") { const d = t.parentElement; setTimeout(() => { S.open[d.dataset.open] = d.open; }, 0); return; }
  hidePop();
  if (t.dataset.l) { if (S.layer !== t.dataset.l) { S.layer = t.dataset.l; S.slide = { all: 0, gs1: 0, lw: 0 }; render(); } }
  else if (t.dataset.p) { S.page = t.dataset.p; render(); }
  else if (t.dataset.nav) go(S.slide[S.page] + +t.dataset.nav);
  else if (t.dataset.to) go(+t.dataset.to);
  else if (t.dataset.go === "next") go(SLIDES.length - 1);
  else if (t.dataset.s) { S.src = t.dataset.s; render(); }

function onKey(e) {

  if (e.key === "ArrowLeft") { e.preventDefault(); go(S.slide[S.page] - 1); }

function onHover(e) {

  document.querySelectorAll(".xh").forEach((l) => l.setAttribute("visibility", "hidden"));
  if (!r) { tip.style.display = "none"; return; }
  const h = HOV[r.dataset.hov]; if (!h) return;
  const s = r.ownerSVGElement, box = s.getBoundingClientRect(), x = ((e.clientX - box.left) / box.width) * s.viewBox.baseVal.width;
  let best = 0, bd = 1e9; for (let i = 0; i < h.n; i++) { const dd = Math.abs(h.X(i) - x); if (dd < bd) { bd = dd; best = i; } }
  const ln = s.querySelector(".xh"); ln.setAttribute("x1", h.X(best)); ln.setAttribute("x2", h.X(best)); ln.setAttribute("visibility", "visible");
  const b = h.bs[best], f = (v) => (h.money ? fmtUsd(v) : fmtN(v));
  tip.innerHTML = `<b>${esc(b.tip)}</b>${b.partial ? " (part)" : ""}<br>` + h.ser.map((x) => `${esc(x.name)}: <b>${isNum(x.values[best]) ? f(x.values[best]) : "n/a"}</b>`).join("<br>");
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - tw - 8)) + "px";

function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem("lfs-theme", t); } catch (_) { /* file:// */ } $("#themeBtn").setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme"); }
async function boot() {
  let saved = null; try { saved = localStorage.getItem("lfs-theme"); } catch (_) { /* file:// */ }
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("#themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  $("#rangeSel").addEventListener("change", (e) => { S.range = e.target.value; render(); });
  document.addEventListener("click", onClick);
  document.addEventListener("change", (e) => { if (e.target.id === "jump") go(+e.target.value); });
  document.addEventListener("keydown", onKey);
  document.addEventListener("mousemove", onHover);
  let tx = null;

  document.addEventListener("touchend", (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 70 && !e.target.closest(".chart, .seg, select")) go(S.slide[S.page] + (dx < 0 ? 1 : -1)); }, { passive: true });

  window.addEventListener("afterprint", () => render());

    D = window.DASH_DATA || (await (await fetch("../data.json", { cache: "no-store" })).json());
    V = D.v2; if (!V) throw new Error("The data file is incomplete; rebuild the dashboard data");
    const s0 = new Date(V.start + "T00:00:00Z");
    DATES = Array.from({ length: V.n_days }, (_, i) => { const x = new Date(s0); x.setUTCDate(x.getUTCDate() + i); return x.toISOString().slice(0, 10); });

    readHash(); render();
  } catch (err) { $("#deck").innerHTML = `<div class="warn">Could not load the dashboard data: ${esc(err.message)}</div>`; }
}
boot();
